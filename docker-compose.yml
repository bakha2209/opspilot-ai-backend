services:
  postgres:
    image: postgres:16
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - opspilot_pg_data:/var/lib/postgresql/data
    networks:
      - opspilot-network

  redis:
    image: redis:7
    container_name: opspilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - opspilot-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: opspilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - opspilot-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: ${BACKEND_DB_HOST:-postgres}
      DB_PORT: ${BACKEND_DB_PORT:-5432}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    ports:
      - "4000:4000"
    volumes:
      - opspilot_uploads:/app/uploads
      - ./blockchain:/app/blockchain
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - ai-service
    networks:
      - opspilot-network
      - fabric-network
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: opspilot-ai-service
    env_file:
      - ./ai-service/app/.env
    environment:
      PYTHONUNBUFFERED: 1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      NEST_BACKEND_BASE_URL: http://backend:4000
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
    ports:
      - "8008:8001"
    networks:
      - opspilot-network
volumes:
  opspilot_pg_data:
  opspilot_uploads:

networks:
  opspilot-network:
    driver: bridge

  fabric-network:
    external: true
    name: opspilot-fabric-network  
