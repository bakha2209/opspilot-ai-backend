limit_req_zone $binary_remote_addr zone=opspilot_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=opspilot_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 127.0.0.1:8080;
  server_name app.opspilots.cc;
  server_tokens off;

  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  client_max_body_size 50m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/v1/auth/login {
    limit_req zone=opspilot_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:14000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
  }

  location = /api/v1/auth/signup {
    limit_req zone=opspilot_auth burst=2 nodelay;
    proxy_pass http://127.0.0.1:14000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
  }

  location /api/ {
    limit_req zone=opspilot_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:14000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:14000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:14000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/opspilot-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
