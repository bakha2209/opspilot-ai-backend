version: "3.8"

networks:
  fabric-network:
    name: opspilot-fabric-network

services:
  orderer.opspilot.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.opspilot.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./organizations/ordererOrganizations/opspilot.com/orderers/orderer.opspilot.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/opspilot.com/orderers/orderer.opspilot.com/tls:/var/hyperledger/orderer/tls
      - orderer.opspilot.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - fabric-network

  couchdb0:
    image: couchdb:3.3
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "15984:5984"
    networks:
      - fabric-network

  peer0.org1.opspilot.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.opspilot.com
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.org1.opspilot.com
      - CORE_PEER_ADDRESS=peer0.org1.opspilot.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.opspilot.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.opspilot.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.opspilot.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=opspilot-fabric-network
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/org1.opspilot.com/peers/peer0.org1.opspilot.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/org1.opspilot.com/peers/peer0.org1.opspilot.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.opspilot.com:/var/hyperledger/production
    depends_on:
      - couchdb0
    ports:
      - "7051:7051"
    networks:
      - fabric-network

  couchdb1:
    image: couchdb:3.3
    container_name: couchdb1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    networks:
      - fabric-network

  peer0.org2.opspilot.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org2.opspilot.com
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.org2.opspilot.com
      - CORE_PEER_ADDRESS=peer0.org2.opspilot.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.opspilot.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.opspilot.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.opspilot.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=opspilot-fabric-network
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/org2.opspilot.com/peers/peer0.org2.opspilot.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/org2.opspilot.com/peers/peer0.org2.opspilot.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org2.opspilot.com:/var/hyperledger/production
    depends_on:
      - couchdb1
    ports:
      - "9051:9051"
    networks:
      - fabric-network

volumes:
  orderer.opspilot.com:
  peer0.org1.opspilot.com:
  peer0.org2.opspilot.com: